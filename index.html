<style>
/* Layout: phone-first app. Home is a grouped list with the main button fixed at thumb height; the card screen fills the phone with controls at the bottom. Black and white, red only for the heart. */
:root {
  --bg: #f2f2f2;
  --card: #ffffff;
  --ink: #111111;
  --muted: #6b6b6b;
  --faint: #b0b0b0;
  --line: #e6e6e6;
  --press: #ececec;
  --btn: #111111;
  --btn-ink: #ffffff;
  --heart: #e0352b;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.05), 0 10px 28px -14px rgba(0, 0, 0, 0.22);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Roboto, "Segoe UI", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --card: #1c1c1e; --ink: #f5f5f5; --muted: #9a9a9e; --faint: #5c5c60; --line: #2c2c2e; --press: #2c2c2e;
    --btn: #f5f5f5; --btn-ink: #000000; --heart: #ff5a4f;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.6), 0 10px 28px -14px rgba(0, 0, 0, 0.9);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --card: #1c1c1e; --ink: #f5f5f5; --muted: #9a9a9e; --faint: #5c5c60; --line: #2c2c2e; --press: #2c2c2e;
  --btn: #f5f5f5; --btn-ink: #000000; --heart: #ff5a4f;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.6), 0 10px 28px -14px rgba(0, 0, 0, 0.9);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.4;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; text-align: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
#app { height: 100%; }

.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.on .ic.fillable, .ic.filled { fill: currentColor; }

/* ---------- Scrolling pages (home, saved) ---------- */
.page {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px calc(104px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 28px;
}
.home-head h1 { margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
.home-head p { margin: 4px 0 0; color: var(--muted); }

.today {
  display: flex; flex-direction: column; gap: 14px; width: 100%;
  background: var(--card); border-radius: 16px; padding: 18px; box-shadow: var(--shadow);
}
.today:active { background: var(--press); }
.small-label { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.today-q { font-size: 23px; font-weight: 700; line-height: 1.25; letter-spacing: -0.01em; }
.today-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 15px; color: var(--muted); }
.today-foot .open { color: var(--ink); font-weight: 600; display: inline-flex; align-items: center; gap: 2px; white-space: nowrap; }
.today-foot .ic { width: 18px; height: 18px; }

.group-label { margin: 0 0 8px 16px; }
.group { background: var(--card); border-radius: 14px; overflow: hidden; }
.row {
  position: relative; display: flex; align-items: center; gap: 14px; width: 100%; min-height: 60px;
  padding: 10px 12px 10px 16px; text-align: left;
}
button.row:active, .row-btn:active { background: var(--press); }
.group > * + *::before { content: ""; position: absolute; top: 0; left: 52px; right: 0; height: 1px; background: var(--line); }
.group > .plain-row + .plain-row::before { left: 16px; }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.row-title { font-weight: 600; }
.row-sub { font-size: 14px; color: var(--muted); }
.row-meta { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chev { width: 18px; height: 18px; color: var(--faint); }
.row.danger .row-title { color: var(--heart); font-weight: 500; }

.field input {
  flex: 1 1 0; width: 0; min-width: 0; height: 40px; margin: 0; border: 0; background: transparent; color: var(--ink);
  font: inherit; text-align: right; padding: 0 4px; -webkit-appearance: none; appearance: none;
}
.field input::placeholder { color: var(--faint); }
.confirm { flex-wrap: wrap; }
.pill { min-height: 40px; padding: 0 16px; border-radius: 999px; font-size: 15px; font-weight: 600; background: var(--press); }
.pill.red { background: var(--heart); color: #ffffff; }

.empty { margin: 0; padding: 32px 20px; text-align: center; color: var(--muted); background: var(--card); border-radius: 14px; }

.bottom-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--bg);
  padding-top: 12px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bottom-bar .btn { display: flex; width: 100%; max-width: 528px; margin: 0 auto; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; padding: 0 20px; border-radius: 14px; font-size: 17px; font-weight: 600; }
.btn:active { opacity: 0.85; }
.btn.primary { background: var(--btn); color: var(--btn-ink); }
.btn.outline { border: 1px solid var(--line); }

/* ---------- Top bar ---------- */
.topbar {
  display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; padding-block: 6px; flex: none;
}
.topbar.sticky { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); margin-bottom: -16px; }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; color: var(--ink); }
.icon-btn:active { background: var(--press); }
.icon-btn.red { color: var(--heart); }
.tb { display: flex; flex-direction: column; align-items: center; min-width: 0; }
.tb-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.tb-sub { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------- Card screen ---------- */
.screen {
  height: 100%; min-height: 560px; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
}
.pile { position: relative; flex: 1; min-height: 340px; margin: 8px 0 34px; }
.stack { position: absolute; inset: 0; border-radius: 20px; background: var(--card); box-shadow: var(--shadow); }
.stack.s1 { transform: translateY(calc(2.5% + 9px)) scale(0.95); opacity: 0.75; }
.stack.s2 { transform: translateY(calc(5% + 18px)) scale(0.9); opacity: 0.45; }
.card {
  position: absolute; inset: 0; border-radius: 20px; background: var(--card); color: var(--ink); box-shadow: var(--shadow);
  padding: 22px 22px 20px; display: flex; flex-direction: column;
  touch-action: pan-y; user-select: none; -webkit-user-select: none;
}
.card-head { display: flex; justify-content: space-between; align-items: center; color: var(--muted); }
.card-head .ic { width: 20px; height: 20px; }
.q { margin: auto 0; font-size: clamp(26px, 7.6vw, 34px); font-weight: 700; line-height: 1.2; letter-spacing: -0.015em; }
.card-foot { font-size: 15px; color: var(--muted); }
.card-foot b { color: var(--ink); font-weight: 600; }

.card.end { justify-content: center; gap: 10px; }
.end-title { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
.end-text { margin: 0 0 12px; color: var(--muted); }
.end-actions { display: flex; flex-direction: column; gap: 10px; }

.controls { flex: none; display: grid; grid-template-columns: 54px 54px 1fr; gap: 10px; }
.ctl { height: 54px; border-radius: 14px; display: grid; place-items: center; background: var(--card); border: 1px solid var(--line); }
.ctl:active { background: var(--press); }
.ctl:disabled { opacity: 0.35; cursor: default; }
.ctl.heart.on { color: var(--heart); }
.ctl.next { display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--btn); color: var(--btn-ink); border: 0; font-size: 17px; font-weight: 600; }
.ctl.next:active { opacity: 0.85; }

/* ---------- Casual / Serious toggle ---------- */
.mode-wrap { display: flex; flex-direction: column; gap: 10px; }
.mode {
  position: relative; display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: 16px;
  background: var(--card); border: 1px solid var(--line);
}
.mode-thumb {
  position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); border-radius: 12px;
  background: var(--press); transition: transform 0.28s cubic-bezier(.3, .9, .3, 1), background-color 0.28s ease;
}
.mode[data-mode="serious"] .mode-thumb { transform: translateX(100%); background: var(--btn); }
.mode button { position: relative; min-height: 48px; border-radius: 12px; font-size: 16px; font-weight: 600; color: var(--muted); text-align: center; transition: color 0.28s ease; }
.mode button[aria-checked="true"] { color: var(--ink); }
.mode[data-mode="serious"] button[aria-checked="true"] { color: var(--btn-ink); }
.mode-note { margin: 0 4px; font-size: 14px; color: var(--muted); }

/* Serious cards are printed in reverse so the mode is obvious at a glance. */
.today.serious, .card.serious { background: var(--btn); color: var(--btn-ink); }
.today.serious:active { background: var(--btn); opacity: 0.92; }
.today.serious .small-label, .today.serious .today-foot,
.card.serious .card-head, .card.serious .card-foot { color: color-mix(in srgb, var(--btn-ink) 62%, transparent); }
.today.serious .today-foot .open, .card.serious .card-foot b { color: var(--btn-ink); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>

const ALL = [];
const BY_ID = {};
DECKS.forEach(d => d.q.forEach((text, i) => {

const modeOf = d => d.mode || "casual";
const pool = m => ALL.filter(x => modeOf(x.deck) === m);

const reduceMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
// Unseen cards come first, so opening a deck starts with something new.
function freshOrder(ids) {
  return shuffle(ids.filter(id => !seen.has(id))).concat(shuffle(ids.filter(id => seen.has(id))));
}
// Picked from the date, so both phones show the same question on the same day.
function tonight() {
  const d = new Date();
  let x = (d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate()) ^ (mode === "serious" ? 0x5bd1e995 : 0x9e3779b9);
  x = Math.imul(x ^ (x >>> 16), 0x85ebca6b);
  x = Math.imul(x ^ (x >>> 13), 0xc2b2ae35);
  x ^= x >>> 16;
  const list = pool(mode);
  return list[(x >>> 0) % list.length];
}

function paintCard() {
  const card = document.getElementById("card");
  const { order, pos } = view;
  const total = order.length;
  const atEnd = pos >= total;
  const item = BY_ID[order[pos]];

  document.getElementById("tb-sub").textContent = atEnd ? "Finished" : `${pos + 1} of ${total}`;
  document.getElementById("prev-btn").disabled = pos === 0;
  document.getElementById("next-btn").disabled = atEnd;
  const saveBtn = document.getElementById("save-btn");
  saveBtn.disabled = atEnd;
  const isSaved = !atEnd && saved.has(item.id);
  saveBtn.classList.toggle("on", isSaved);
  saveBtn.setAttribute("aria-pressed", String(isSaved));
  document.getElementById("s1").hidden = pos + 1 >= total;
  document.getElementById("s2").hidden = pos + 2 >= total;

  if (atEnd) {
    card.className = "card end";
    card.innerHTML = `
      <p class="end-title">You've finished this deck</p>
      <p class="end-text">${total === 1 ? "That was the only card." : `All ${total} cards done.`}</p>
      <div class="end-actions">
        <button class="btn primary" data-act="reshuffle">Shuffle and start again</button>
        <button class="btn outline" data-act="home">Back to decks</button>
      </div>`;
    return;
  }

  const who = names[(pos + view.first) % 2];
  const other = names[(pos + view.first + 1) % 2];
  const serious = modeOf(item.deck) === "serious";
  card.className = serious ? "card serious" : "card";
  card.innerHTML = `
    <div class="card-head"><span class="small-label">${esc(item.deck.name)}</span>${svg(item.deck.icon)}</div>
    <p class="q">${esc(item.text)}</p>
    <div class="card-foot">${serious
      ? `<b>${esc(who)}</b> goes first, then <b>${esc(other)}</b>`
      : `<b>${esc(who)}</b> answers first`}</div>`;

  if (!seen.has(item.id)) { seen.add(item.id); persist(); }
}

let swapping = false;
function go(dir) {
  const np = view.pos + dir;
  if (np < 0 || np > view.order.length || swapping) return;
  const card = document.getElementById("card");
  const done = () => { view.pos = np; paintCard(); };
  if (reduceMotion()) { card.style.transform = ""; done(); return; }
  swapping = true;
  const from = card.style.transform || "none";
  card.animate(
    [{ transform: from, opacity: 1 }, { transform: `translateX(${-dir * 115}%) rotate(${-dir * 8}deg)`, opacity: 0 }],
    { duration: 220, easing: "cubic-bezier(.4,0,.7,.4)" }
  ).onfinish = () => {
    card.style.transform = "";
    done();
    card.animate(
      [{ transform: "translateY(14px) scale(.96)", opacity: 0.4 }, { transform: "none", opacity: 1 }],
      { duration: 260, easing: "cubic-bezier(.2,.8,.2,1)" }
    ).onfinish = () => { swapping = false; };
  };
}

function bindSwipe(card) {
  let x0 = null, dx = 0;
  card.addEventListener("pointerdown", e => {
    if (e.button !== 0 || e.target.closest("button") || card.classList.contains("end") || swapping) return;
    x0 = e.clientX; dx = 0;
    card.setPointerCapture(e.pointerId);
  });
  card.addEventListener("pointermove", e => {
    if (x0 === null) return;
    dx = e.clientX - x0;
    card.style.transform = `translateX(${dx}px) rotate(${dx / 20}deg)`;
  });
  const end = () => {
    if (x0 === null) return;
    x0 = null;
    const dir = dx < -70 ? 1 : dx > 70 ? -1 : 0;
    const blocked = (dir === -1 && view.pos === 0) || (dir === 1 && view.pos >= view.order.length);
    if (dir && !blocked) { go(dir); return; }
    const from = card.style.transform;
    card.style.transform = "";
    if (from && !reduceMotion()) card.animate([{ transform: from }, { transform: "none" }], { duration: 200, easing: "cubic-bezier(.2,.9,.3,1.2)" });
  };
  card.addEventListener("pointerup", end);
  card.addEventListener("pointercancel", end);
}

        ? `<div class="group">${items.map(it => `
            <div class="row plain-row">
              <button class="row-main" data-act="open-saved" data-id="${it.id}">
                <span class="small-label">${esc(it.deck.name)}</span>
                <span class="row-title">${esc(it.text)}</span>
              </button>
              <button class="icon-btn red" data-act="unsave" data-id="${it.id}" aria-label="Remove from saved">${svg("heart", "filled")}</button>
            </div>`).join("")}</div>`
        : `<p class="empty">No saved questions yet. Tap the heart on a card to save it.</p>`}
    </div>
    ${items.length ? `<div class="bottom-bar"><button class="btn primary" data-act="play-saved">Play saved questions</button></div>` : ""}`;
}

app.addEventListener("click", e => {
  const deckBtn = e.target.closest("[data-deck]");
  if (deckBtn) { openDeck(deckBtn.dataset.deck); return; }
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act;
  if (act === "mode") setMode(b.dataset.mode);
  else if (act === "mix") openDeck("mix");
  else if (act === "tonight") openDeck("mix", tonight().id);
  else if (act === "saved") { view = { name: "saved" }; render(); window.scrollTo(0, 0); }
  else if (act === "home") { view = { name: "home" }; render(); window.scrollTo(0, 0); }
  else if (act === "next") go(1);
  else if (act === "prev") go(-1);
  else if (act === "reshuffle") {
    view.order = shuffle(view.order.slice());
    view.pos = 0;
    view.first = Math.random() < 0.5 ? 0 : 1;
    paintCard();
  }
  else if (act === "save") {
    const id = view.order[view.pos];
    if (!id) return;
    saved.has(id) ? saved.delete(id) : saved.add(id);
    persist();
    paintCard();
  }
  else if (act === "unsave") { saved.delete(b.dataset.id); persist(); renderSaved(); }
  else if (act === "open-saved") openDeck("saved", b.dataset.id);
  else if (act === "play-saved") openDeck("saved");
  else if (act === "reset-ask") {
    document.getElementById("reset-area").innerHTML = `
      <div class="row plain-row confirm">
        <span class="row-main"><span class="row-title">Reset all progress?</span><span class="row-sub">Every card will show as unasked again.</span></span>
        <button class="pill red" data-act="reset-yes">Reset</button>
        <button class="pill" data-act="reset-no">Cancel</button>
      </div>`;
  }
  else if (act === "reset-yes") { seen = new Set(); persist(); renderHome(); }
  else if (act === "reset-no") renderHome();
});

document.addEventListener("keydown", e => {
  if (view.name !== "deck" || e.target.closest("input")) return;
  if (e.key === "ArrowRight") go(1);
  else if (e.key === "ArrowLeft") go(-1);
  else if (e.key === "Escape") { view = { name: "home" }; render(); }
});

render();
</script>
</body>
</html>

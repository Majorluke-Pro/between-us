<style>
/* Layout: phone-first app. Home is a grouped list with the main button fixed at thumb height; the card screen fills the phone with controls at the bottom. Black and white, red only for the heart. */
:root {
  --bg: #f2f2f2;
  --card: #ffffff;
  --ink: #111111;
  --muted: #6b6b6b;
  --faint: #b0b0b0;
  --line: #e6e6e6;
  --press: #ececec;
  --btn: #111111;
  --btn-ink: #ffffff;
  --heart: #e0352b;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.05), 0 10px 28px -14px rgba(0, 0, 0, 0.22);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Roboto, "Segoe UI", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --card: #1c1c1e; --ink: #f5f5f5; --muted: #9a9a9e; --faint: #5c5c60; --line: #2c2c2e; --press: #2c2c2e;
    --btn: #f5f5f5; --btn-ink: #000000; --heart: #ff5a4f;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.6), 0 10px 28px -14px rgba(0, 0, 0, 0.9);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --card: #1c1c1e; --ink: #f5f5f5; --muted: #9a9a9e; --faint: #5c5c60; --line: #2c2c2e; --press: #2c2c2e;
  --btn: #f5f5f5; --btn-ink: #000000; --heart: #ff5a4f;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.6), 0 10px 28px -14px rgba(0, 0, 0, 0.9);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { overflow-x: hidden; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.4;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; text-align: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
#app { height: 100%; }

.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.on .ic.fillable, .ic.filled { fill: currentColor; }

/* ---------- Scrolling pages (home, saved) ---------- */
.page {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px calc(104px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 28px;
}
.home-head h1 { margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
.home-head p { margin: 4px 0 0; color: var(--muted); }

.small-label { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }

.group-label { margin: 0 0 8px 16px; }
.group { background: var(--card); border-radius: 14px; overflow: hidden; }
.row {
  position: relative; display: flex; align-items: center; gap: 14px; width: 100%; min-height: 60px;
  padding: 10px 12px 10px 16px; text-align: left;
}
button.row:active, .row-btn:active { background: var(--press); }
.group > * + *::before { content: ""; position: absolute; top: 0; left: 52px; right: 0; height: 1px; background: var(--line); }
.group > .plain-row + .plain-row::before { left: 16px; }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.row-title { font-weight: 600; }
.row-sub { font-size: 14px; color: var(--muted); }
.row-meta { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chev { width: 18px; height: 18px; color: var(--faint); }
.row.danger .row-title { color: var(--heart); font-weight: 500; }

.field input {
  flex: 1 1 0; width: 0; min-width: 0; height: 40px; margin: 0; border: 0; background: transparent; color: var(--ink);
  font: inherit; text-align: right; padding: 0 4px; -webkit-appearance: none; appearance: none;
}
.field input::placeholder { color: var(--faint); }
.confirm { flex-wrap: wrap; }
.pill { min-height: 40px; padding: 0 16px; border-radius: 999px; font-size: 15px; font-weight: 600; background: var(--press); }
.pill.red { background: var(--heart); color: #ffffff; }

.empty { margin: 0; padding: 32px 20px; text-align: center; color: var(--muted); background: var(--card); border-radius: 14px; }

.bottom-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--bg);
  padding-top: 12px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bottom-bar .btn { display: flex; width: 100%; max-width: 528px; margin: 0 auto; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; padding: 0 20px; border-radius: 14px; font-size: 17px; font-weight: 600; }
.btn:active { opacity: 0.85; }
.btn.primary { background: var(--btn); color: var(--btn-ink); }
.btn.outline { border: 1px solid var(--line); }

/* ---------- Top bar ---------- */
.topbar {
  display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; padding-block: 6px; flex: none;
}
.topbar.sticky { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); margin-bottom: -16px; }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; color: var(--ink); }
.icon-btn:active { background: var(--press); }
.icon-btn.red { color: var(--heart); }
.tb { display: flex; flex-direction: column; align-items: center; min-width: 0; }
.tb-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.tb-sub { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------- Card screen ---------- */
.screen {
  height: 100%; min-height: 560px; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
}
.pile { position: relative; flex: 1; min-height: 340px; margin: 8px 0 34px; touch-action: none; }
.card {
  position: absolute; inset: 0; border-radius: 20px; background: var(--card); color: var(--ink);
  border: 1px solid var(--line); box-shadow: var(--shadow);
  padding: 22px 22px 20px; display: flex; flex-direction: column;
  transform-origin: 50% 55%;
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; cursor: grab;
}
/* Only promote a card to its own layer while a finger is on it. A permanent will-change makes the
   browser keep the text bitmap from whatever size the card was, which is what blurred it. */
.card.dragging { cursor: grabbing; will-change: transform; }
.card.end { cursor: default; }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.card-head { display: flex; justify-content: space-between; align-items: center; color: var(--muted); }
.q { margin: auto 0; font-size: clamp(26px, 7.6vw, 34px); font-weight: 700; line-height: 1.2; letter-spacing: -0.015em; }
.card-foot { font-size: 15px; color: var(--muted); }
.card-foot b { color: var(--ink); font-weight: 600; }

.card.end { justify-content: center; gap: 10px; }
.end-title { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
.end-text { margin: 0 0 12px; color: var(--muted); }
.end-actions { display: flex; flex-direction: column; gap: 10px; }

.controls { flex: none; display: grid; grid-template-columns: 54px 54px 1fr; gap: 10px; }
.ctl { height: 54px; border-radius: 14px; display: grid; place-items: center; background: var(--card); border: 1px solid var(--line); }
.ctl:active { background: var(--press); }
.ctl:disabled { opacity: 0.35; cursor: default; }
.ctl.heart.on { color: var(--heart); }
.ctl.next { display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--btn); color: var(--btn-ink); border: 0; font-size: 17px; font-weight: 600; }
.ctl.next:active { opacity: 0.85; }

/* ---------- Zoom between a pack and its deck ---------- */
.morph { position: fixed; inset: 0; z-index: 60; pointer-events: none; }
.morph-shell { position: fixed !important; inset: auto; padding: 0; transform-origin: 0 0; will-change: transform; }
.snap { position: fixed; inset: 0; z-index: 40; pointer-events: none; background: var(--bg); overflow: hidden; }

/* ---------- Deck packs on the home screen ---------- */
.packs { display: grid; grid-template-columns: 1fr 1fr; gap: 26px 16px; padding: 6px 4px 0; }
.pack { position: relative; display: block; width: 100%; aspect-ratio: 3 / 4; transition: transform 0.15s ease; }
.pack:active { transform: scale(0.97); }
.pack .face {
  position: absolute; inset: 0; border-radius: 12px; background: var(--card); color: var(--ink);
  border: 1px solid var(--line); box-shadow: var(--shadow);
}
.pack .b2 { transform: rotate(-5deg) translate(-4px, 5px); }
.pack .b1 { transform: rotate(3.5deg) translate(4px, 2px); }
.pack .front { display: flex; flex-direction: column; justify-content: space-between; padding: 12px 12px 13px; text-align: left; }
.pack-top { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pack-mark { align-self: center; }
/* Solid deck icon on a rounded tile, like an app icon. The small tile sits in the card header. */
.tile { display: grid; place-items: center; width: 76px; height: 76px; border-radius: 22px; background: var(--press); color: var(--ink); }
.tile .mdi { display: block; width: 42px; height: 42px; fill: currentColor; }
.tile.small { width: 32px; height: 32px; border-radius: 10px; }
.tile.small .mdi { width: 19px; height: 19px; }
.packs.serious .tile, .card.serious .tile { background: color-mix(in srgb, var(--btn-ink) 12%, var(--btn)); color: var(--btn-ink); }
.pack-label { display: flex; flex-direction: column; min-width: 0; }
.pack-name { font-size: 17px; font-weight: 700; line-height: 1.15; letter-spacing: -0.01em; }
.pack-sub { font-size: 12.5px; line-height: 1.3; margin-top: 3px; color: var(--muted); }
.pack-bar { display: block; height: 3px; border-radius: 3px; background: var(--line); margin-top: 10px; overflow: hidden; }
.pack-bar i { display: block; height: 100%; background: currentColor; }
/* Serious packs are printed in reverse, like the serious cards themselves. */
.packs.serious .face { background: var(--btn); color: var(--btn-ink); border-color: color-mix(in srgb, var(--btn-ink) 16%, var(--btn)); }
.packs.serious .pack-top, .packs.serious .pack-sub { color: color-mix(in srgb, var(--btn-ink) 60%, transparent); }
.packs.serious .pack-bar { background: color-mix(in srgb, var(--btn-ink) 22%, transparent); }

/* ---------- Casual / Serious toggle ---------- */
.mode-wrap { display: flex; flex-direction: column; gap: 10px; }
.mode {
  position: relative; display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: 16px;
  background: var(--card); border: 1px solid var(--line);
}
.mode-thumb {
  position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); border-radius: 12px;
  background: var(--press); transition: transform 0.28s cubic-bezier(.3, .9, .3, 1), background-color 0.28s ease;
}
.mode[data-mode="serious"] .mode-thumb { transform: translateX(100%); background: var(--btn); }
.mode button { position: relative; min-height: 48px; border-radius: 12px; font-size: 16px; font-weight: 600; color: var(--muted); text-align: center; transition: color 0.28s ease; }
.mode button[aria-checked="true"] { color: var(--ink); }
.mode[data-mode="serious"] button[aria-checked="true"] { color: var(--btn-ink); }
.mode-note { margin: 0 4px; font-size: 14px; color: var(--muted); }

/* Serious cards are printed in reverse so the mode is obvious at a glance. */
.card.serious { background: var(--btn); color: var(--btn-ink); border-color: color-mix(in srgb, var(--btn-ink) 16%, var(--btn)); }
.card.serious .card-head, .card.serious .card-foot { color: color-mix(in srgb, var(--btn-ink) 62%, transparent); }
.card.serious .card-foot b { color: var(--btn-ink); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>

  const item = { id: d.id + ":" + i, text, deck: d, n: i + 1 };
  ALL.push(item);
  BY_ID[item.id] = item;
}));

// Saved cards and progress are stored by card position, so they only make sense for one set of questions.
// Clear them once when a new set ships, otherwise an old heart would land on a different question.
const QUESTION_SET = 2;
if (store.get("questionSet", 1) !== QUESTION_SET) {
  store.set("saved", []);
  store.set("seen", []);
  store.set("questionSet", QUESTION_SET);
}
let saved = new Set(store.get("saved", []).filter(id => BY_ID[id]));
let seen = new Set(store.get("seen", []).filter(id => BY_ID[id]));
let names = store.get("names", ["Luke", "Mieke"]);
if (names[1] === "Her") names[1] = "Mieke";
let mode = store.get("mode", "casual") === "serious" ? "serious" : "casual";
const persist = () => { store.set("saved", [...saved]); store.set("seen", [...seen]); };
const modeOf = d => d.mode || "casual";
const pool = m => ALL.filter(x => modeOf(x.deck) === m);

const reduceMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
// Unseen cards come first, so opening a deck starts with something new.
function freshOrder(ids) {
  return shuffle(ids.filter(id => !seen.has(id))).concat(shuffle(ids.filter(id => seen.has(id))));
}
const app = document.getElementById("app");
let view = { name: "home" };

function render() {
  if (view.name === "deck") renderDeck();
  else if (view.name === "saved") renderSaved();
  else renderHome();
}

function deckList() {
  return `
    <h2 class="small-label group-label">${mode === "serious" ? "Serious decks" : "Decks"}</h2>
    <div class="packs${mode === "serious" ? " serious" : ""}">${DECKS.filter(d => modeOf(d) === mode).map(deckPack).join("")}</div>`;
}

function setMode(m) {
  if (m === mode) return;
  mode = m;
  store.set("mode", mode);
  const toggle = document.getElementById("mode");
  toggle.dataset.mode = mode;
  toggle.querySelectorAll("[data-mode]").forEach(b => b.setAttribute("aria-checked", String(b.dataset.mode === mode)));
  document.getElementById("mode-note").textContent = MODE_NOTE[mode];
  document.getElementById("deck-slot").innerHTML = deckList();
}

function renderHome() {
  app.innerHTML = `
    <div class="page">
      <header class="home-head">
        <h1>Between Us</h1>
        <p>${esc(names[0])} &amp; ${esc(names[1])}</p>
      </header>

      <div class="mode-wrap">
        <div class="mode" id="mode" data-mode="${mode}" role="radiogroup" aria-label="Question type">
          <span class="mode-thumb" aria-hidden="true"></span>
          <button role="radio" aria-checked="${mode === "casual"}" data-act="mode" data-mode="casual">Casual</button>
          <button role="radio" aria-checked="${mode === "serious"}" data-act="mode" data-mode="serious">Serious</button>
        </div>
        <p class="mode-note" id="mode-note">${MODE_NOTE[mode]}</p>
      </div>

      <section id="deck-slot">${deckList()}</section>

      <div class="group">
        <button class="row" data-act="saved">${svg("heart")}<span class="row-main"><span class="row-title">Saved questions</span></span><span class="row-meta">${saved.size}</span>${svg("chev", "chev")}</button>
      </div>

      <section>
        <h2 class="small-label group-label">Names</h2>
        <div class="group">
          <label class="row plain-row field" for="name-a"><span class="row-title">Player 1</span><input id="name-a" maxlength="18" autocomplete="off" value="${esc(names[0])}"></label>
          <label class="row plain-row field" for="name-b"><span class="row-title">Player 2</span><input id="name-b" maxlength="18" autocomplete="off" value="${esc(names[1])}"></label>
        </div>
      </section>

      <div class="group" id="reset-area">
        <button class="row plain-row danger" data-act="reset-ask"><span class="row-main"><span class="row-title">Reset progress</span></span></button>
      </div>
    </div>
    <div class="bottom-bar"><button class="btn primary" data-act="mix">${svg("shuffle")} Random card</button></div>`;

  const save = () => {
    names = [document.getElementById("name-a").value.trim() || "Player 1", document.getElementById("name-b").value.trim() || "Player 2"];
    store.set("names", names);
  };
  document.getElementById("name-a").addEventListener("input", save);
  document.getElementById("name-b").addEventListener("input", save);

// Each deck is a mini pack: the front card plus two cards fanned out behind it.
function deckPack(d) {
  const done = d.q.filter((_, i) => seen.has(d.id + ":" + i)).length;
  return `
    <button class="pack" data-deck="${d.id}" aria-label="${esc(d.name)}, ${done} of ${d.q.length} asked">
      <span class="face b2" aria-hidden="true"></span>
      <span class="face b1" aria-hidden="true"></span>
      <span class="face front">
        <span class="pack-top"><span>${d.q.length} cards</span><span>${done}/${d.q.length}</span></span>
        <span class="pack-mark">${tile(d.icon)}</span>
        <span class="pack-label">
          <span class="pack-name">${esc(d.name)}</span>
          <span class="pack-sub">${SUB[d.id]}</span>
          <span class="pack-bar"><i style="width:${Math.round(done / d.q.length * 100)}%"></i></span>
        </span>
      </span>
    </button>`;
}

function openDeck(kind, startId) {
  let ids, title;
  if (kind === "mix") { ids = pool(mode).map(x => x.id); title = mode === "serious" ? "All serious decks" : "All decks"; }
  else if (kind === "saved") { ids = [...saved]; title = "Saved questions"; }
  else { const d = DECKS.find(x => x.id === kind); ids = d.q.map((_, i) => d.id + ":" + i); title = d.name; }
  let order = freshOrder(ids);
  if (startId) order = [startId, ...order.filter(id => id !== startId)];
  if (view.name === "home") homeScroll = window.scrollY;
  view = { name: "deck", kind, title, order, pos: 0, first: Math.random() < 0.5 ? 0 : 1 };
  render();
  window.scrollTo(0, 0);
}

function goHome() {
  view = { name: "home" };
  render();
  window.scrollTo(0, homeScroll);
}

// ---------- Zooming into a deck and back out ----------
// Tapping a pack morphs it into the first card of the deck. The card grows out of the pack as an empty
// shell, the pack's icon and name glide up into their places in the card's header, the pack's small
// details ride outward and fade, and the question fades up once the card is nearly full size.
// Going back plays the same morph in reverse.
// Every moving piece is a copy pinned to its own rectangle and animated with transform and opacity only,
// from keyframes worked out here in advance. Nothing is laid out again mid-animation, so the browser can
// run the whole thing on the compositor.
const ZOOM_MS = 560;
const STEPS = 40;
let homeScroll = 0;
let zooming = false;

function bezier(x1, y1, x2, y2) {
  const at = (a, b, t) => 3 * a * (1 - t) * (1 - t) * t + 3 * b * (1 - t) * t * t + t * t * t;
  return x => {
    let lo = 0, hi = 1, t = x;
    for (let i = 0; i < 24; i++) {
      const v = at(x1, x2, t);
      if (Math.abs(v - x) < 1e-5) break;
      if (v < x) lo = t; else hi = t;
      t = (lo + hi) / 2;
    }
    return at(y1, y2, t);
  };
}
const EASE_CARD = bezier(0.22, 0.8, 0.2, 1);
// The icon and name get to their spots early, so they read as moving out of the way for the card.
const EASE_FAST = bezier(0.15, 0.95, 0.12, 1);

const clamp01 = v => Math.max(0, Math.min(1, v));
const ramp = (p, a, b) => clamp01((p - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const lerpRect = (a, b, p) => ({ left: lerp(a.left, b.left, p), top: lerp(a.top, b.top, p), width: lerp(a.width, b.width, p), height: lerp(a.height, b.height, p) });
const rectOf = el => { const r = el.getBoundingClientRect(); return { left: r.left, top: r.top, width: r.width, height: r.height }; };
const pin = (el, r) => Object.assign(el.style, { position: "fixed", left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px", margin: "0" });

// Copy an element out of the page with its look frozen in, so it can travel on its own.
function lift(el) {
  const rect = rectOf(el);
  const copy = el.cloneNode(true);
  const from = [el, ...el.querySelectorAll("*")];
  const to = [copy, ...copy.querySelectorAll("*")];
  from.forEach((s, i) => {
    const cs = getComputedStyle(s);
    const d = to[i].style;
    ["color", "fontFamily", "fontSize", "fontWeight", "letterSpacing", "textTransform", "lineHeight",
      "display", "justifyContent", "justifyItems", "alignItems", "gap", "backgroundColor", "borderRadius", "stroke", "strokeWidth", "whiteSpace"]
      .forEach(k => { d[k] = cs[k]; });
  });
  pin(copy, rect);
  copy.style.transformOrigin = "0 0";
  copy.style.willChange = "transform, opacity";
  return { rect, copy };
}

const packParts = pack => {
  const f = pack.querySelector(".front");
  return { box: f, icon: f.querySelector(".pack-mark .tile"), name: f.querySelector(".pack-name"), extras: [".pack-top", ".pack-sub", ".pack-bar"].map(s => f.querySelector(s)) };
};
const cardParts = card => ({
  box: card, icon: card.querySelector(".card-head .tile"), name: card.querySelector(".card-head .small-label"),
  extras: [card.querySelector(".q"), card.querySelector(".card-foot")]
});

// Measure one side of the morph and copy its pieces out while they are still on screen.
function capture(parts) {
  return {
    box: rectOf(parts.box), cls: parts.box.className,
    icon: lift(parts.icon), name: lift(parts.name),
    extras: parts.extras.filter(Boolean).map(lift)
  };
}

// The card shell: stretched from the pack's rectangle to the card's.
function grow(el, home, a, b, dir) {
  const frames = [];
  for (let i = 0; i <= STEPS; i++) {
    const t = i / STEPS;
    const r = lerpRect(a, b, dir > 0 ? EASE_CARD(t) : 1 - EASE_CARD(t));
    frames.push({ transform: `translate(${(r.left - home.left).toFixed(2)}px, ${(r.top - home.top).toFixed(2)}px) scale(${(r.width / home.width).toFixed(4)}, ${(r.height / home.height).toFixed(4)})` });
  }
  return el.animate(frames, { duration: ZOOM_MS, easing: "linear", fill: "forwards" });
}

// A piece that rides inside the growing card. Its spot is measured as a fraction of the card, so it can
// never drift outside it: it starts where it sat in the pack (a, within P) and glides to where it sits in
// the card (b, within C). `glide` sets how quickly it gets there relative to the card's own growth.
function ride(el, home, a, b, P, C, dir, glide, opacityAt) {
  const fa = { x: (a.left - P.left) / P.width, y: (a.top - P.top) / P.height };
  const fb = { x: (b.left - C.left) / C.width, y: (b.top - C.top) / C.height };
  const frames = [];
  for (let i = 0; i <= STEPS; i++) {
    const t = i / STEPS;
    const pc = dir > 0 ? EASE_CARD(t) : 1 - EASE_CARD(t);
    const pg = dir > 0 ? glide(t) : 1 - glide(t);
    const card = lerpRect(P, C, pc);
    const left = card.left + lerp(fa.x, fb.x, pg) * card.width;
    const top = card.top + lerp(fa.y, fb.y, pg) * card.height;
    const s = lerp(a.width, b.width, pg) / home.width;
    frames.push({
      transform: `translate(${(left - home.left).toFixed(2)}px, ${(top - home.top).toFixed(2)}px) scale(${s.toFixed(4)})`,
      opacity: opacityAt(pc, pg).toFixed(3)
    });
  }
  return el.animate(frames, { duration: ZOOM_MS, easing: "linear", fill: "forwards" });
}

// Morph between a captured pack (P) and a captured card (C). dir 1 goes into the deck, -1 back out.
function morph(P, C, dir, done) {
  const layer = document.createElement("div");
  layer.className = "morph";
  const pr = P.box, cr = C.box;
  const anims = [];
  const into = (r, from, to) => ({
    left: to.left + (r.left - from.left) * to.width / from.width,
    top: to.top + (r.top - from.top) * to.height / from.height,
    width: r.width, height: r.height
  });
  const add = el => { layer.appendChild(el); return el; };

  // The card itself: an empty shell, so nothing inside it reflows while it grows.
  const shell = document.createElement("div");
  shell.className = C.cls + " morph-shell";
  pin(shell, cr);
  anims.push(grow(add(shell), cr, pr, cr, dir));

  // The pack's count, subtitle and progress bar stay put on the card as it grows, and fade quickly.
  P.extras.forEach(x => anims.push(ride(add(x.copy), x.rect, x.rect, into(x.rect, pr, cr), pr, cr, dir, EASE_CARD, pc => 1 - ramp(pc, 0, 0.22))));

  // The icon slides from the middle of the pack up into the card's top-right corner, and the name from
  // the bottom up into the header. Each cross-fades from the pack's style to the card's on the way.
  [[P.icon, C.icon, 0.06, 0.4, 0.12, 0.46], [P.name, C.name, 0.04, 0.36, 0.16, 0.54]].forEach(([from, to, o1, o2, i1, i2]) => {
    anims.push(ride(add(from.copy), from.rect, from.rect, to.rect, pr, cr, dir, EASE_FAST, (pc, pg) => 1 - ramp(pg, o1, o2)));
    anims.push(ride(add(to.copy), to.rect, from.rect, to.rect, pr, cr, dir, EASE_FAST, (pc, pg) => ramp(pg, i1, i2)));
  });

  // The question and footer are already laid out at full size; they fade up as the card arrives.
  C.extras.forEach(x => anims.push(ride(add(x.copy), x.rect, into(x.rect, cr, pr), x.rect, pr, cr, dir, EASE_CARD, pc => ramp(pc, 0.55, 0.95))));

  document.body.appendChild(layer);
  let finished = false;
  const finish = () => {
    if (finished) return;
    finished = true;
    layer.remove();
    done();
  };
  anims[0].onfinish = finish;
  setTimeout(finish, ZOOM_MS + 500);
}

function openDeckFromPack(pack) {
  const id = pack.dataset.deck;
  if (zooming) return;
  if (reduceMotion() || !pack.querySelector(".front")) { openDeck(id); return; }
  zooming = true;
  const P = capture(packParts(pack));
  const snap = snapshot(P.box.left + P.box.width / 2, P.box.top + P.box.height / 2);
  snap.querySelector(`[data-deck="${id}"] .front`).style.visibility = "hidden";

  deck.quietDeal = true;
  openDeck(id);
  document.body.appendChild(snap);
  const C = capture(cardParts(deck.els[0]));
  deck.els.forEach(el => { el.style.opacity = "0"; });

  // The home screen pushes forward and fades, like moving into the pack.
  snap.animate([{ opacity: 1, transform: "scale(1)" }, { opacity: 0, transform: "scale(1.08)" }],
    { duration: 420, easing: "cubic-bezier(.3,.6,.4,1)", fill: "forwards" });
  app.querySelectorAll(".topbar, .controls").forEach(el => el.animate(
    [{ opacity: 0, transform: "translateY(10px)" }, { opacity: 1, transform: "none" }],
    { duration: 320, delay: 280, easing: "ease-out", fill: "backwards" }
  ));

  morph(P, C, 1, () => {
    deck.els.forEach(el => { el.style.opacity = ""; });
    snap.remove();
    // The cards underneath slide out from beneath the one that just landed.
    deck.els.slice(1).forEach((el, i) => el.animate([{ transform: "none" }, { transform: depthTf(i + 1) }], { duration: 420, easing: EASE_SETTLE }));
    zooming = false;
  });
}

function closeDeck() {
  if (zooming) return;
  const kind = view.kind;
  const top = deck.els[0];
  const d = DECKS.find(x => x.id === kind);
  if (reduceMotion() || !top || top.classList.contains("end") || !d || modeOf(d) !== mode) { goHome(); return; }
  zooming = true;
  const C = capture(cardParts(top));
  const chrome = snapshot(window.innerWidth / 2, window.innerHeight / 2);
  chrome.querySelectorAll(".card").forEach(el => el.remove());
  goHome();

  const pack = app.querySelector(`[data-deck="${kind}"]`);
  const front = pack && pack.querySelector(".front");
  const fr = front && front.getBoundingClientRect();
  const page = app.querySelector(".page");
  if (!fr || fr.bottom < 0 || fr.top > window.innerHeight) {
    page.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 240, easing: "ease-out" });
    zooming = false;
    return;
  }
  const P = capture(packParts(pack));
  front.style.visibility = "hidden";

  // The deck's buttons fade away while the home screen settles back in around the pack.
  document.body.appendChild(chrome);
  chrome.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200, easing: "ease-out", fill: "forwards" });
  const pg = page.getBoundingClientRect();
  page.style.transformOrigin = `${fr.left + fr.width / 2 - pg.left}px ${fr.top + fr.height / 2 - pg.top}px`;
  page.animate([{ opacity: 0, transform: "scale(1.08)" }, { opacity: 1, transform: "none" }], { duration: 460, easing: "cubic-bezier(.2,.7,.3,1)" });
  app.querySelectorAll(".bottom-bar").forEach(el => el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300, delay: 160, fill: "backwards" }));

  morph(P, C, -1, () => {
    front.style.visibility = "";
    chrome.remove();
    zooming = false;
  });
}

// A frozen copy of the current screen, so it can fall away while the real screen changes underneath.
function snapshot(originX, originY) {
  const snap = document.createElement("div");
  snap.className = "snap";
  const inner = document.createElement("div");
  inner.style.transform = `translateY(${-window.scrollY}px)`;
  [...app.children].forEach(el => (el.classList.contains("bottom-bar") ? snap : inner).appendChild(el.cloneNode(true)));
  snap.prepend(inner);
  snap.querySelectorAll("[id]").forEach(el => el.removeAttribute("id"));
  snap.style.transformOrigin = `${originX}px ${originY}px`;
  return snap;
}

// ---------- Card deck ----------
// The top three cards are real elements stacked on top of each other. Dragging the top card
// lifts the one behind it into place, and letting go flings it off at the speed of your finger.
const deck = { els: [], pile: null, live: null, drag: null };
const STACK = 3;

// Damped-spring easing curve for CSS, so snap-backs settle like a physical card.
function spring(zeta, omega, fallback) {
  try { if (!CSS.supports("animation-timing-function", "linear(0, 1)")) return fallback; } catch (e) { return fallback; }
  const wd = omega * Math.sqrt(1 - zeta * zeta);
  const pts = [];
  for (let i = 0; i <= 60; i++) {
    const t = i / 60;
    const v = 1 - Math.exp(-zeta * omega * t) * (Math.cos(wd * t) + (zeta * omega / wd) * Math.sin(wd * t));
    pts.push(v.toFixed(4));
  }
  return `linear(${pts.join(", ")})`;
}
const EASE_BOUNCE = spring(0.62, 13, "cubic-bezier(.17,1.3,.3,1)");
const EASE_SETTLE = spring(0.9, 11, "cubic-bezier(.2,.8,.25,1)");

const tf = (x, y, r, s) => `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0) rotate(${r.toFixed(2)}deg) scale(${s.toFixed(4)})`;
const stepY = () => deck.pile.clientHeight * 0.025 + 10;
// The top card rests with no transform at all so its text is drawn at full sharpness.
const depthTf = d => d === 0 ? "none" : tf(0, d * stepY(), 0, 1 - 0.05 * d);

function renderDeck() {
  app.innerHTML = `
    <div class="screen">
      <div class="topbar">
        <button class="icon-btn" data-act="home" aria-label="Back">${svg("back")}</button>
        <div class="tb"><span class="tb-title">${esc(view.title)}</span><span class="tb-sub" id="tb-sub"></span></div>
        <button class="icon-btn" data-act="reshuffle" aria-label="Shuffle">${svg("shuffle")}</button>
      </div>
      <div class="pile" id="pile"></div>
      <p class="sr" id="live" aria-live="polite"></p>
      <div class="controls">
        <button class="ctl" data-act="prev" id="prev-btn" aria-label="Previous card">${svg("left")}</button>
        <button class="ctl heart" data-act="save" id="save-btn" aria-label="Save" aria-pressed="false">${svg("heart", "fillable")}</button>
        <button class="ctl next" data-act="next" id="next-btn">Next ${svg("right")}</button>
      </div>
    </div>`;
  deck.pile = document.getElementById("pile");
  deck.live = document.getElementById("live");
  deck.drag = null;
  bindSwipe();
  buildPile();
}

function makeCard(index) {
  const el = document.createElement("article");
  const total = view.order.length;
  if (index >= total) {
    el.className = "card end";
    el.innerHTML = `
      <p class="end-title">You've finished this deck</p>
      <p class="end-text">${total === 1 ? "That was the only card." : `All ${total} cards done.`}</p>
      <div class="end-actions">
        <button class="btn primary" data-act="reshuffle">Shuffle and start again</button>
        <button class="btn outline" data-act="home">Back to decks</button>
      </div>`;
    return el;
  }
  const item = BY_ID[view.order[index]];
  const who = names[(index + view.first) % 2];
  const other = names[(index + view.first + 1) % 2];
  const serious = modeOf(item.deck) === "serious";
  el.className = serious ? "card serious" : "card";
  el.innerHTML = `
    <div class="card-head"><span class="small-label">${esc(item.deck.name)}</span>${tile(item.deck.icon, true)}</div>
    <p class="q">${esc(item.text)}</p>
    <div class="card-foot">${serious
      ? `<b>${esc(who)}</b> goes first, then <b>${esc(other)}</b>`
      : `<b>${esc(who)}</b> answers first`}</div>`;
  return el;
}

// Freeze a running animation where it is, so a new one can start from that exact spot.
function settle(el) {
  if (!el._anim) return;
  try { el._anim.commitStyles(); } catch (e) {}
  el._anim.cancel();
  el._anim = null;
}

function animateTo(el, to, duration, easing) {
  settle(el);
  const from = el.style.transform || to;
  el.style.transform = to;
  if (reduceMotion() || from === to) return;
  const a = el.animate([{ transform: from }, { transform: to }], { duration, easing });
  el._anim = a;
  a.onfinish = () => { if (el._anim === a) el._anim = null; };
}

// Deal a fresh pile: used when the deck opens or is reshuffled.
function buildPile() {
  // When the deck opens by zooming in from its pack, the zoom is the entrance, so skip the deal.
  const quiet = deck.quietDeal;
  deck.quietDeal = false;
  deck.els.forEach(el => { settle(el); el.remove(); });
  deck.pile.querySelectorAll(".card").forEach(el => el.remove());
  deck.els = [];
  for (let i = 0; i < STACK && view.pos + i <= view.order.length; i++) {
    const el = makeCard(view.pos + i);
    el.style.zIndex = 10 - i;
    el.style.transform = depthTf(i);
    deck.pile.appendChild(el);
    deck.els.push(el);
    if (!reduceMotion() && !quiet) {
      // Slide into place without any scaling on the top card, so the question never looks soft.
      const from = i === 0 ? "translate3d(0, 28px, 0)" : depthTf(i + 0.7);
      el.animate(
        [{ transform: from, opacity: 0 }, { transform: depthTf(i), opacity: 1 }],
        { duration: 380, delay: i * 60, easing: "cubic-bezier(.2,.8,.25,1)", fill: "backwards" }
      );
    }
  }
  syncUI();
}

// Move every card to its slot in the stack and top the stack back up to three.
function restack(topEasing = EASE_SETTLE, topDuration = 520) {
  deck.els.forEach((el, i) => {
    el.style.zIndex = 10 - i;
    el.style.pointerEvents = "";
    animateTo(el, depthTf(i), i === 0 ? topDuration : 480, i === 0 ? topEasing : EASE_SETTLE);
  });
  let next = view.pos + deck.els.length;
  while (deck.els.length < STACK && next <= view.order.length) {
    const i = deck.els.length;
    const el = makeCard(next);
    el.style.zIndex = 10 - i;
    el.style.transform = depthTf(i + 1);
    deck.pile.appendChild(el);
    deck.els.push(el);
    animateTo(el, depthTf(i), 480, EASE_SETTLE);
    if (!reduceMotion()) el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 320, easing: "ease-out" });
    next++;
  }
}

function flyOut(el, dir, vx, vy, fromButton) {
  settle(el);
  el.style.zIndex = 20;
  el.style.pointerEvents = "none";
  el.inert = true;
  const pos = el._pos || { x: 0, y: 0, r: 0 };
  const w = deck.pile.clientWidth;
  const tx = dir * (window.innerWidth / 2 + w);
  const dist = Math.abs(tx - pos.x);
  // Match the starting speed of the throw to the finger: the curve's opening slope is 1.6.
  const speed = Math.max(Math.abs(vx), 0.9);
  const dur = fromButton ? 420 : Math.min(560, Math.max(240, 1.6 * dist / speed));
  const ty = fromButton ? -24 : pos.y + Math.max(-260, Math.min(260, vy * dur * 0.6));
  const tr = fromButton ? dir * 14 : pos.r + dir * 12;
  const from = el.style.transform;
  const to = tf(tx, ty, tr, 1);
  el.style.transform = to;
  if (reduceMotion()) { el.remove(); return; }
  const a = el.animate([{ transform: from }, { transform: to }], {
    duration: dur,
    easing: fromButton ? "cubic-bezier(.5,0,.7,.6)" : "cubic-bezier(.25,.4,.5,1)"
  });
  removeAfter(el, a, dur);
}

function advance(dir = -1, vx = 0, vy = 0, fromButton = true) {
  if (view.pos >= view.order.length || !deck.els.length) return;
  const top = deck.els.shift();
  view.pos++;
  flyOut(top, dir, vx, vy, fromButton);
  restack();
  syncUI();
}

// Where the previous card waits, just off the left edge of the screen.
const offLeft = () => -(window.innerWidth / 2 + deck.pile.clientWidth);
const prevParked = () => tf(offLeft(), -30, -16, 1);

// Bring the previous card back in from the left. A swipe passes in the card it already pulled in.
function back(el = null, easing = EASE_BOUNCE, duration = 640) {
  if (view.pos <= 0) return;
  view.pos--;
  if (!el) {
    el = makeCard(view.pos);
    el.style.transform = prevParked();
    deck.pile.appendChild(el);
  }
  el._pos = null;
  deck.els.unshift(el);
  while (deck.els.length > STACK) {
    const old = deck.els.pop();
    settle(old);
    if (reduceMotion()) old.remove();
    else removeAfter(old, old.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200 }), 200);
  }
  restack(easing, duration);
  syncUI();
}

function syncUI() {
  const { order, pos } = view;
  const total = order.length;
  const atEnd = pos >= total;
  const item = BY_ID[order[pos]];
  document.getElementById("tb-sub").textContent = atEnd ? "Finished" : `${pos + 1} of ${total}`;
  document.getElementById("prev-btn").disabled = pos === 0;
  document.getElementById("next-btn").disabled = atEnd;
  const saveBtn = document.getElementById("save-btn");
  saveBtn.disabled = atEnd;
  const isSaved = !atEnd && saved.has(item.id);
  saveBtn.classList.toggle("on", isSaved);
  saveBtn.setAttribute("aria-pressed", String(isSaved));
  deck.els.forEach((el, i) => { el.inert = i !== 0; el.setAttribute("aria-hidden", String(i !== 0)); });
  deck.live.textContent = atEnd ? "You've finished this deck." : item.text;
  if (!atEnd && !seen.has(item.id)) { seen.add(item.id); persist(); }
}

// Thumb left drags the top card away to reveal the next one.
// Thumb right pulls the previous card back in from the left, and the stack sinks to make room.
function paintDrag(d) {
  const w = deck.pile.clientWidth;
  const atEnd = view.pos >= view.order.length;
  if (d.dx < 0 || (d.dx > 0 && view.pos === 0)) {
    // Nothing to bring back on the first card, and nothing after the end card, so those drags just stretch a little.
    const x = d.dx < 0 && !atEnd ? d.dx : d.dx * 0.22;
    // Cards pivot the way a real one does: grab the top half and it tips one way, the bottom half the other.
    const r = d.tilt * (x / w) * 16;
    const y = d.dx < 0 ? d.dy * 0.4 : 0;
    d.el._pos = { x, y, r };
    d.el.style.transform = tf(x, y, r, 1);
    const lift = d.dx < 0 && !atEnd ? Math.min(1, -d.dx / (w * 0.5)) : 0;
    deck.els.slice(1).forEach((el, i) => { el.style.transform = depthTf(i + 1 - lift); });
    if (d.prev) d.prev.style.transform = prevParked();
    return;
  }
  if (!d.prev) {
    d.prev = makeCard(view.pos - 1);
    d.prev.style.zIndex = 15;
    d.prev.inert = true;
    deck.pile.appendChild(d.prev);
  }
  const p = Math.min(1, d.dx / (w * 0.85));
  d.prevProgress = p;
  d.prev.style.transform = tf(offLeft() * (1 - p), -30 * (1 - p), -16 * (1 - p), 1);
  d.el._pos = null;
  deck.els.forEach((el, i) => { el.style.transform = depthTf(i + p); });
}

function dropPrev(el) {
  const from = el.style.transform;
  const to = prevParked();
  el.style.transform = to;
  if (reduceMotion()) { el.remove(); return; }
  removeAfter(el, el.animate([{ transform: from }, { transform: to }], { duration: 320, easing: "cubic-bezier(.3,.6,.4,1)" }), 320);
}

// Remove a card once its exit animation ends. The timer backs this up in case the phone
// pauses rendering mid-animation, so finished cards never pile up off-screen.
function removeAfter(el, anim, duration) {
  const done = () => el.remove();
  anim.onfinish = done;
  setTimeout(done, duration + 250);
}

function bindSwipe() {
  const pile = deck.pile;
  let frame = 0;
  pile.addEventListener("pointerdown", e => {
    const top = deck.els[0];
    if (deck.drag || !top || e.button !== 0 || !top.contains(e.target) || e.target.closest("button")) return;
    deck.els.forEach(settle);
    const rect = top.getBoundingClientRect();
    deck.drag = {
      id: e.pointerId, el: top, x0: e.clientX, y0: e.clientY, dx: 0, dy: 0,
      tilt: e.clientY - rect.top < rect.height / 2 ? 1 : -1,
      samples: [{ x: e.clientX, y: e.clientY, t: e.timeStamp }]
    };
    top.setPointerCapture(e.pointerId);
    top.classList.add("dragging");
  });
  pile.addEventListener("pointermove", e => {
    const d = deck.drag;
    if (!d || e.pointerId !== d.id) return;
    d.dx = e.clientX - d.x0;
    d.dy = e.clientY - d.y0;
    d.samples.push({ x: e.clientX, y: e.clientY, t: e.timeStamp });
    if (d.samples.length > 8) d.samples.shift();
    if (!frame) frame = requestAnimationFrame(() => { frame = 0; if (deck.drag) paintDrag(deck.drag); });
  });
  const end = e => {
    const d = deck.drag;
    if (!d || e.pointerId !== d.id) return;
    deck.drag = null;
    if (frame) { cancelAnimationFrame(frame); frame = 0; }
    paintDrag(d);
    d.el.classList.remove("dragging");
    const last = d.samples[d.samples.length - 1];
    const first = d.samples.find(s => last.t - s.t <= 100) || d.samples[0];
    const dt = Math.max(1, last.t - first.t);
    const vx = (last.x - first.x) / dt;
    const vy = (last.y - first.y) / dt;
    const w = pile.clientWidth;
    const cancelled = e.type === "pointercancel";
    const atEnd = view.pos >= view.order.length;
    if (d.dx < 0 && !atEnd && !cancelled && (-d.dx > w * 0.32 || (vx < -0.45 && d.dx < -24))) {
      if (d.prev) d.prev.remove();
      advance(-1, vx, vy, false);
    } else if (d.prev && d.dx > 0 && !cancelled && (d.prevProgress > 0.35 || (vx > 0.45 && d.dx > 24))) {
      back(d.prev, EASE_SETTLE, 460);
    } else {
      if (d.prev) dropPrev(d.prev);
      d.el._pos = null;
      restack(EASE_BOUNCE, 620);
    }
  };
  pile.addEventListener("pointerup", end);
  pile.addEventListener("pointercancel", end);
}

function renderSaved() {
  const items = [...saved].map(id => BY_ID[id]).filter(Boolean);
  app.innerHTML = `
    <div class="page">
      <div class="topbar sticky">
        <button class="icon-btn" data-act="home" aria-label="Back">${svg("back")}</button>
        <div class="tb"><span class="tb-title">Saved questions</span><span class="tb-sub">${items.length}</span></div>
        <span></span>
      </div>
      ${items.length
        ? `<div class="group">${items.map(it => `
            <div class="row plain-row">
              <button class="row-main" data-act="open-saved" data-id="${it.id}">
                <span class="small-label">${esc(it.deck.name)}</span>
                <span class="row-title">${esc(it.text)}</span>
              </button>
              <button class="icon-btn red" data-act="unsave" data-id="${it.id}" aria-label="Remove from saved">${svg("heart", "filled")}</button>
            </div>`).join("")}</div>`
        : `<p class="empty">No saved questions yet. Tap the heart on a card to save it.</p>`}
    </div>
    ${items.length ? `<div class="bottom-bar"><button class="btn primary" data-act="play-saved">Play saved questions</button></div>` : ""}`;
}

app.addEventListener("click", e => {
  const deckBtn = e.target.closest("[data-deck]");
  if (deckBtn) { openDeckFromPack(deckBtn); return; }
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act;
  if (act === "mode") setMode(b.dataset.mode);
  else if (act === "mix") openDeck("mix");
  else if (act === "saved") { view = { name: "saved" }; render(); window.scrollTo(0, 0); }
  else if (act === "home") view.name === "deck" ? closeDeck() : goHome();
  else if (act === "next") advance();
  else if (act === "prev") back();
  else if (act === "reshuffle") {
    view.order = shuffle(view.order.slice());
    view.pos = 0;
    view.first = Math.random() < 0.5 ? 0 : 1;
    buildPile();
  }
  else if (act === "save") {
    const id = view.order[view.pos];
    if (!id) return;
    saved.has(id) ? saved.delete(id) : saved.add(id);
    persist();
    syncUI();
  }
  else if (act === "unsave") { saved.delete(b.dataset.id); persist(); renderSaved(); }
  else if (act === "open-saved") openDeck("saved", b.dataset.id);
  else if (act === "play-saved") openDeck("saved");
  else if (act === "reset-ask") {
    document.getElementById("reset-area").innerHTML = `
      <div class="row plain-row confirm">
        <span class="row-main"><span class="row-title">Reset all progress?</span><span class="row-sub">Every card will show as unasked again.</span></span>
        <button class="pill red" data-act="reset-yes">Reset</button>
        <button class="pill" data-act="reset-no">Cancel</button>
      </div>`;
  }
  else if (act === "reset-yes") { seen = new Set(); persist(); renderHome(); }
  else if (act === "reset-no") renderHome();
});

document.addEventListener("keydown", e => {
  if (view.name !== "deck" || e.target.closest("input")) return;
  if (e.key === "ArrowRight") advance();
  else if (e.key === "ArrowLeft") back();
  else if (e.key === "Escape") closeDeck();
});

render();
</script>
</body>
</html>
